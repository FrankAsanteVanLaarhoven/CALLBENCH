name: Authorship Policy

on:
  pull_request:
  push:

jobs:
  authorship-policy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check repository content
        run: python scripts/check_authorship_policy.py --tree . --skip-identity

      # Full history is enforced: no cutoff. AUTHORSHIP_SINCE stays supported in
      # the script for a repository that inherits history it cannot rewrite.
      - name: Check Git history
        run: bash scripts/check_git_history.sh
