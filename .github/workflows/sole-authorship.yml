name: Sole Authorship

on:
  pull_request:
  push:

jobs:
  sole-authorship:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check repository content
        run: python scripts/enforce_sole_authorship.py --tree . --skip-identity

      # Full history is enforced: no cutoff. AUTHORSHIP_SINCE stays supported in
      # the script for a repository that inherits history it cannot rewrite.
      - name: Check Git history
        run: bash scripts/enforce_history_authorship.sh
